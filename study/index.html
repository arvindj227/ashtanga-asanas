<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="study.css">
</head>
<body>
<header class="study-top">
  <div class="progress-wrap">
    <div class="progress-meta" id="study-progress-meta">Study</div>
    <div class="progress-bar"><div class="progress-fill" id="study-progress-fill"></div></div>
  </div>
</header>

<main class="app-main">
  <div id="view-hub" class="view">
    <h1 class="study-page-title">Study</h1>
    <div class="seg has-thumb" id="hub-seg" role="tablist">
      <button type="button" id="tab-learn" class="active" role="tab" aria-selected="true">Learn</button>
      <button type="button" id="tab-recall" role="tab" aria-selected="false">Recall</button>
    </div>
    <div class="hub-list-wrap" id="hub-list-wrap">
      <div id="hub-list"></div>
    </div>
  </div>

  <div id="view-drill" class="view hidden">
    <button type="button" id="btn-back" class="drill-back">← All topics</button>
    <div class="card drill-card" id="drill-card">
      <div class="drill-head">
        <h2 class="drill-topic" id="drill-title"></h2>
        <div class="drill-tools" id="drill-tools"></div>
      </div>
      <div id="drill-body"></div>
    </div>
  </div>
</main>

<footer class="app-foot">
  <a href="../index.html">Back to the app</a>
</footer>

<script src="poses-data.js"></script>
<script src="pose-image-bg.js"></script>
<script src="vinyasa-counts.js"></script>
<script src="app.js"></script>
</body>
</html>
