<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Breath, a pacer study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Jost', system-ui, sans-serif;
  --font-dev: 'Noto Serif Devanagari', serif;

  /* Dusk (default) */
  --bg: #15110F;
  --bg-2: #1F1816;
  --fg: #F1E9DF;
  --fg-soft: rgba(241,233,223,.82);
  --fg-muted: rgba(241,233,223,.62);
  --fg-faint: rgba(241,233,223,.22);
  --line: rgba(241,233,223,.12);
  --panel: rgba(30,24,21,.55);
  --panel-border: rgba(241,233,223,.10);

  /* Disc colour state, driven by JS (0 = moon, 1 = sun) */
  --core: #F4F6F8;
  --mid: #D2D8DF;
  --edge: #8F9CAB;
  --glow: 170,190,210;
  --glow-a: .22;
  --scale: .56;
  --rise: 0px;
}

[data-theme="dawn"] {
  --bg: #F7F2ED;
  --bg-2: #EFE6DC;
  --fg: #1E1A17;
  --fg-soft: rgba(30,26,23,.82);
  --fg-muted: rgba(30,26,23,.64);
  --fg-faint: rgba(30,26,23,.22);
  --line: rgba(30,26,23,.10);
  --panel: rgba(255,255,255,.55);
  --panel-border: rgba(30,26,23,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { overflow-y: auto; touch-action: pan-y; }

body {
  font-family: var(--font-body);
  font-weight: 300;
  color: var(--fg);
  background: radial-gradient(120% 80% at 50% 110%, var(--bg-2) 0%, var(--bg) 60%);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background .9s ease, color .9s ease;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Grain */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  opacity: .04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  z-index: 0;
}

.stage {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
}

/* Header */
.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.eyebrow {
  font-size: .68rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--fg-muted);
}
.eyebrow span { color: var(--fg-faint); margin: 0 .5em; }
.icons { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg-muted);
  display: grid; place-items: center;
  cursor: pointer;
  transition: color .3s, border-color .3s, background .3s;
}
.icon-btn:hover { color: var(--fg); border-color: var(--fg-faint); }
.icon-btn[aria-pressed="true"] { color: var(--fg); background: var(--panel); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* Centre */
.centre {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 4vmin, 40px);
  min-height: 0;
}

.disc-wrap {
  position: relative;
  width: min(62vmin, 420px, 36vh);
  height: min(62vmin, 420px, 36vh);
  display: grid;
  place-items: center;
  cursor: pointer;
}

/* Resting ring: shows the full extent of the breath */
.disc-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  opacity: .9;
}

/* Soft pool of light beneath the disc, brightens as it fills */
.ground {
  position: absolute;
  left: 50%; bottom: -6%;
  width: 110%; height: 22%;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(var(--glow), calc(var(--glow-a) * .5)) 0%, rgba(var(--glow), calc(var(--glow-a) * .15)) 40%, rgba(var(--glow), 0) 72%);
  transform: translateX(-50%) scaleX(calc(.7 + var(--scale) * .4));
  pointer-events: none;
}

.halo {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(var(--glow), calc(var(--glow-a) * .9)) 0%,
    rgba(var(--glow), calc(var(--glow-a) * .55)) 30%,
    rgba(var(--glow), calc(var(--glow-a) * .22)) 46%,
    rgba(var(--glow), calc(var(--glow-a) * .06)) 60%,
    rgba(var(--glow), 0) 70%);
  transform: translateY(var(--rise)) scale(calc(var(--scale) * 1.35));
  will-change: transform;
}

.disc {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 42% 38%, var(--core) 0%, var(--mid) 42%, var(--edge) 100%);
  /* The wide glow lives in .halo (a gradient); keep the disc's own shadow tight so the repainted area stays small */
  box-shadow:
    inset 0 -8px 30px rgba(0,0,0,.10),
    0 0 34px rgba(var(--glow), calc(var(--glow-a) * .9));
  transform: translateY(var(--rise)) scale(var(--scale));
  will-change: transform;
}

/* a whisper of texture on the surface */
.disc::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 62% 66%, rgba(0,0,0,.08), transparent 55%);
  mix-blend-mode: multiply;
}

/* Labels */
.label {
  text-align: center;
}
.phase {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(2.6rem, 8vmin, 3.6rem);
  letter-spacing: .01em;
  line-height: 1;
  transition: opacity .55s ease, transform .55s ease;
}
.phase.swap { opacity: 0; transform: translateY(4px); }
.sanskrit {
  margin-top: .6em;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.25rem, 4.2vmin, 1.55rem);
  color: var(--fg-soft);
  transition: opacity .55s ease;
}
.sanskrit .dev { font-family: var(--font-dev); font-weight: 500; font-size: .92em; margin-left: .45em; }
.sanskrit.swap { opacity: 0; }

.counter {
  margin-top: 1.5em;
  margin-bottom: .4em;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  min-height: 18px;
  font-family: var(--font-display);
  font-size: 1.15rem;
  letter-spacing: .06em;
  color: var(--fg-soft);
}
.counter .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--fg-faint);
  transition: background .5s ease, transform .5s ease;
}
.counter .dot.done { background: var(--fg-muted); }
.counter .dot.now { transform: scale(1.5); background: var(--fg); }

/* Controls */
.controls {
  display: flex;
  justify-content: center;
  transition: opacity .6s ease, transform .6s ease, visibility 0s linear 0s;
}
.top { transition: opacity .6s ease, visibility 0s linear 0s; }
/* visibility:hidden after the fade so the panel's backdrop blur stops costing frames while breathing */
.controls.hidden, .top.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition-delay: 0s, 0s, .6s; }
.controls.hidden { transform: translateY(8px); }

.controls { flex-direction: column; align-items: center; gap: 14px; padding-bottom: 6px; }

/* Segmented sound control: one track, a sliding thumb */
.seg {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: min(100%, 300px);
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
}
.seg-thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 3);
  border-radius: 999px;
  background: var(--fg);
  transform: translateX(calc(var(--i, 0) * 100%));
  transition: transform .45s cubic-bezier(.4,.1,.2,1);
}
.seg button {
  position: relative;
  font: 400 .95rem var(--font-body);
  letter-spacing: .02em;
  padding: 9px 0;
  border: 0;
  background: none;
  color: var(--fg-muted);
  cursor: pointer;
  transition: color .35s ease;
}
.seg button[aria-pressed="true"] { color: var(--bg); }

.summary {
  font: 500 1.08rem var(--font-display);
  letter-spacing: .01em;
  color: var(--fg-muted);
  background: none;
  border: 0;
  padding: 6px 10px;
  cursor: pointer;
  transition: color .3s ease;
}
.summary:hover { color: var(--fg); }

/* Settings sheet */
.sheet-scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
  z-index: 5;
}
.sheet {
  position: fixed;
  left: 50%; bottom: 0;
  width: min(100%, 460px);
  transform: translate(-50%, 104%);
  transition: transform .5s cubic-bezier(.3,.1,.2,1);
  z-index: 6;
  padding: 10px 26px max(22px, env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0;
  background: var(--bg-2);
  border-top: 1px solid var(--panel-border);
  display: flex; flex-direction: column; gap: 6px;
}
body.sheet-open .sheet { transform: translate(-50%, 0); }
body.sheet-open .sheet-scrim { opacity: 1; pointer-events: auto; }
.sheet-grip { width: 36px; height: 4px; border-radius: 4px; background: var(--fg-faint); margin: 0 auto 12px; }

.row {
  display: grid;
  grid-template-columns: 72px 1fr 52px;
  align-items: center;
  gap: 14px;
  min-height: 48px;
}
.row[hidden] { display: none; }
.row-label { font-size: .95rem; color: var(--fg-soft); }
.row output { font: 500 1.15rem var(--font-display); text-align: right; color: var(--fg); }
.row-count { grid-template-columns: 72px 1fr; }
.counts { display: flex; justify-content: space-between; }
.counts button {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  padding: 0 0 1px;
  border-radius: 50%;
  border: 0;
  background: none;
  font: 400 1rem var(--font-body);
  line-height: 1;
  color: var(--fg-muted);
  cursor: pointer;
  transition: background .3s ease, color .3s ease;
}
.counts button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.sheet-done {
  margin-top: 10px;
  align-self: center;
  font: 500 .95rem var(--font-body);
  letter-spacing: .04em;
  color: var(--fg);
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 32px;
  cursor: pointer;
}

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 22px;
  background: transparent;
  cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 1px; background: var(--fg-faint);
}
input[type=range]::-moz-range-track { height: 1px; background: var(--fg-faint); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; margin-top: -6.5px;
  border-radius: 50%;
  background: var(--fg);
  border: none;
}
input[type=range]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--fg); border: none;
}

</style>
</head>
<body data-theme="dusk">

<main class="stage">
  <header class="top" id="top">
    <div class="eyebrow">Breath<span>|</span>a pacer study</div>
    <div class="icons">
      <button class="icon-btn" id="btn-theme" aria-pressed="false" title="Dawn / Dusk">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="centre">
    <div class="disc-wrap" id="disc" role="button" aria-label="Start or pause the breath">
      <div class="ground"></div>
      <div class="halo"></div>
      <div class="disc"></div>
    </div>

    <div class="label">
      <div class="phase" id="phase">Begin</div>
      <div class="sanskrit" id="sanskrit">tap the disc</div>
      <div class="counter" id="counter"></div>
    </div>
  </section>

  <footer class="controls" id="controls">
    <div class="seg" id="chips-sound" role="radiogroup" aria-label="Sound">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button data-sound="off" aria-pressed="true">Mute</button>
      <button data-sound="tone" aria-pressed="false">Tone</button>
      <button data-sound="guided" aria-pressed="false">Guided</button>
    </div>
    <button class="summary" id="btn-settings" aria-expanded="false">
      <span id="summary-text">5 s breath, 0.6 s rest, 5 breaths</span>
    </button>
  </footer>
</main>

<div class="sheet-scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Settings" aria-hidden="true">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="row">
    <span class="row-label">Breath</span>
    <input type="range" id="in-len" min="3" max="10" step="0.5" value="5">
    <output id="out-len">5 s</output>
  </div>
  <div class="row">
    <span class="row-label">Rest</span>
    <input type="range" id="in-hold" min="0" max="3" step="0.2" value="0.6">
    <output id="out-hold">0.6 s</output>
  </div>
  <div class="row row-count">
    <span class="row-label">Breaths</span>
    <div class="counts" id="chips-count">
      <button data-n="5" aria-pressed="true">5</button>
      <button data-n="8" aria-pressed="false">8</button>
      <button data-n="10" aria-pressed="false">10</button>
      <button data-n="25" aria-pressed="false">25</button>
      <button data-n="0" aria-pressed="false">&infin;</button>
    </div>
  </div>
  <button class="sheet-done" id="btn-done">Done</button>
</section>

<script>
(() => {
  // Palette endpoints. t = 1 is full inhale (sun), t = 0 is empty (moon).
  const PAL = {
    dusk: {
      sun:  { core: '#FFF4D6', mid: '#F2C577', edge: '#C9843A', glow: [236,168,86],  a: .48 },
      moon: { core: '#F5F7F9', mid: '#CBD3DB', edge: '#8593A3', glow: [168,186,206], a: .18 },
    },
    dawn: {
      sun:  { core: '#FFF7E0', mid: '#F3C879', edge: '#D08A3C', glow: [228,160,72],  a: .42 },
      moon: { core: '#FFFFFF', mid: '#E6EBF0', edge: '#B7C2CF', glow: [150,170,195], a: .20 },
    },
  };

  const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (ha, hb, t) => {
    const a = hex2rgb(ha), b = hex2rgb(hb);
    return `rgb(${a.map((v,i) => Math.round(lerp(v, b[i], t))).join(',')})`;
  };
  const easeInOut = p => 0.5 - 0.5 * Math.cos(Math.PI * p);
  // Slightly asymmetric feel: inhale fills a touch faster at the start, exhale releases slowly.
  const easeIn  = p => 0.5 - 0.5 * Math.cos(Math.PI * Math.pow(p, .92));
  const easeOut = p => 1 - (0.5 - 0.5 * Math.cos(Math.PI * Math.pow(p, 1.08)));

  const body = document.body;
  const el = {
    disc: document.getElementById('disc'),
    phase: document.getElementById('phase'),
    sanskrit: document.getElementById('sanskrit'),
    counter: document.getElementById('counter'),
    controls: document.getElementById('controls'),
    top: document.getElementById('top'),
    len: document.getElementById('in-len'), outLen: document.getElementById('out-len'),
    hold: document.getElementById('in-hold'), outHold: document.getElementById('out-hold'),
    chips: document.getElementById('chips-count'),
    soundChips: document.getElementById('chips-sound'),
    summary: document.getElementById('summary-text'),
    settings: document.getElementById('btn-settings'),
    sheet: document.getElementById('sheet'),
    scrim: document.getElementById('scrim'),
    done: document.getElementById('btn-done'),
    theme: document.getElementById('btn-theme'),
  };

  const S = {
    running: false,
    phase: 'idle',          // idle | inhale | top | exhale | bottom | done
    phaseStart: 0,
    phaseElapsed: 0,        // for pause / resume
    fullness: 0,            // 0..1
    inhale: 5, exhale: 5, holdTop: .6, holdBottom: .25,
    target: 5, count: 0,
    sound: 'off',           // off | tone | guided
    theme: 'dusk',
  };

  const PHASE_TEXT = {
    idle:   ['Begin', 'tap the disc'],
    inhale: ['Inhale', 'pūraka <span class="dev">पूरक</span>'],
    top:    ['Rest',   'kumbhaka <span class="dev">कुम्भक</span>'],
    exhale: ['Exhale', 'recaka <span class="dev">रेचक</span>'],
    bottom: ['',       ''],
    paused: ['Paused', ''],
    done:   ['Complete', ''],
  };

  let shownPhase = null;
  function showLabel(key) {
    if (key === shownPhase) return;
    const prev = shownPhase;
    shownPhase = key;
    // 'bottom' keeps the Exhale label; no visual flicker between breaths
    if (key === 'bottom') return;
    const [title, sub] = PHASE_TEXT[key];
    el.phase.classList.add('swap'); el.sanskrit.classList.add('swap');
    setTimeout(() => {
      el.phase.textContent = title;
      el.phase.classList.toggle('done', key === 'done');
      el.sanskrit.innerHTML = sub;
      el.phase.classList.remove('swap'); el.sanskrit.classList.remove('swap');
    }, prev === null ? 0 : 280);
  }

  function renderCounter() {
    const c = el.counter;
    if (S.target && S.target <= 10) {
      c.innerHTML = '';
      for (let i = 0; i < S.target; i++) {
        const d = document.createElement('span');
        d.className = 'dot' + (i < S.count ? ' done' : '') + (i === S.count && S.running ? ' now' : '');
        c.appendChild(d);
      }
    } else if (S.target) {
      c.textContent = `${S.count} of ${S.target}`;
    } else {
      c.textContent = S.count ? `${S.count} ${S.count === 1 ? 'breath' : 'breaths'}` : '';
    }
  }

  // Per-frame vars go on the disc wrapper, not :root, so only the disc restyles each frame.
  function paint(f) {
    const p = PAL[S.theme];
    const st = el.disc.style;
    st.setProperty('--core', mix(p.moon.core, p.sun.core, f));
    st.setProperty('--mid',  mix(p.moon.mid,  p.sun.mid,  f));
    st.setProperty('--edge', mix(p.moon.edge, p.sun.edge, f));
    const g = p.moon.glow.map((v, i) => Math.round(lerp(v, p.sun.glow[i], f)));
    st.setProperty('--glow', g.join(','));
    st.setProperty('--glow-a', lerp(p.moon.a, p.sun.a, f).toFixed(3));
    st.setProperty('--scale', (0.56 + 0.38 * f).toFixed(4));
    st.setProperty('--rise', (-(f * 1.5)).toFixed(2) + '%');
  }

  // Audio. S.sound is 'off' | 'tone' | 'guided'.
  // 'tone' is one voice that swells and sinks with the breath, for eyes open.
  // 'guided' is the same voice, with silence through the hold. The quiet is the cue to pause.
  let actx = null, osc = null, gain = null, master = null;
  function ensureAudio() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    // Full scale into the output, so the phone's own volume buttons are the volume.
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    master = actx.createGain(); master.gain.value = 1;
    master.connect(actx.destination);

    // One held tone, B3. Fundamental plus a little octave (2nd) and a trace of the 3rd:
    // a soft bowed quality with nothing bell-like above it. Only the volume breathes.
    gain = actx.createGain(); gain.gain.value = 0;
    const real = new Float32Array([0, 0, 0, 0]);
    const imag = new Float32Array([0, 1, 0.12, 0.03]);
    osc = actx.createOscillator();
    osc.setPeriodicWave(actx.createPeriodicWave(real, imag, { disableNormalization: true }));
    osc.frequency.value = TONE_HZ;
    osc.connect(gain); gain.connect(master);
    osc.start();
  }
  const TONE_HZ = 247;                                      // B3
  // Peak around -18 dBFS; the phone's volume does the rest.
  const PAD_MAX = 0.12;
  // The swell is shaped in decibels, not amplitude, so the ear hears an even rise across the
  // whole inhale instead of a jump at the start. Tone spans 20 dB (Eddie Stern's swell is about
  // 15 dB); Guided goes deeper, so the exhale sinks toward the silence of the hold.
  const padLevel = f => {
    const swingDb = S.sound === 'guided' ? 30 : 20;
    return PAD_MAX * Math.pow(10, -swingDb * (1 - f) / 20);
  };

  function restartParam(param, t) {
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
  }
  function curve(N, fn) { const a = new Float32Array(N); for (let i = 0; i < N; i++) a[i] = fn(i / (N - 1)); return a; }

  // Scheduled on the audio clock per phase, so it stays in time even if the screen stutters.
  function schedulePad(phase, remainingMs, fFrom) {
    if (S.sound === 'off' || !actx) return;
    const t = actx.currentTime;
    const lead = 0.12;                                       // glide from wherever we are, avoids clicks
    const d = Math.max(0.02, remainingMs / 1000);
    const span = Math.max(0.02, d - lead - 0.002);
    const t0 = t + lead + 0.001;
    const guided = S.sound === 'guided';
    restartParam(gain.gain, t);

    const fAt = phase === 'inhale' ? p => fFrom + (1 - fFrom) * easeIn(p)
              : phase === 'exhale' ? p => fFrom * easeOut(p)
              : () => (phase === 'top' ? 1 : 0);

    if (phase === 'inhale' || phase === 'exhale') {
      gain.gain.linearRampToValueAtTime(padLevel(fAt(0)), t + lead);
      gain.gain.setValueCurveAtTime(curve(48, p => padLevel(fAt(p))), t0, span);
    } else if (guided && phase === 'top') {
      gain.gain.linearRampToValueAtTime(0, t + 0.35);        // silence at the top: the quiet is the hold
    } else {
      gain.gain.linearRampToValueAtTime(padLevel(fAt(0)), t + lead);
    }
  }
  function audioOff() {
    if (!actx) return;
    const t = actx.currentTime;
    restartParam(gain.gain, t);
    gain.gain.setTargetAtTime(0, t, 0.2);
  }
  // Loop
  function durationOf(phase) {
    return { inhale: S.inhale, top: S.holdTop, exhale: S.exhale, bottom: S.holdBottom }[phase] * 1000;
  }
  function nextPhase(phase) {
    return { inhale: 'top', top: 'exhale', exhale: 'bottom', bottom: 'inhale' }[phase];
  }

  function enter(phase, now) {
    S.phase = phase; S.phaseStart = now; S.phaseElapsed = 0;
    if (phase === 'inhale' && S.target && S.count >= S.target) { finish(); return; }
    showLabel(phase);
    renderCounter();
    schedulePad(phase, durationOf(phase), (phase === 'inhale' || phase === 'bottom') ? 0 : 1);
  }

  function frame(now) {
    if (!S.running) return;
    let elapsed = now - S.phaseStart;
    let dur = durationOf(S.phase);
    while (elapsed >= dur) {
      if (S.phase === 'exhale') S.count++;
      const carry = elapsed - dur;
      enter(nextPhase(S.phase), now - carry);
      if (!S.running) return;
      elapsed = now - S.phaseStart;
      dur = durationOf(S.phase);
    }
    const p = dur > 0 ? elapsed / dur : 1;
    switch (S.phase) {
      case 'inhale': S.fullness = easeIn(p); break;
      case 'top':    S.fullness = 1; break;
      case 'exhale': S.fullness = easeOut(p); break;
      case 'bottom': S.fullness = 0; break;
    }
    paint(S.fullness);
    requestAnimationFrame(frame);
  }

  function start() {
    if (S.phase === 'done' || S.phase === 'idle') { S.count = 0; S.phase = 'idle'; }
    S.running = true;
    if (S.sound !== 'off') { ensureAudio(); actx.resume(); }
    const now = performance.now();
    if (S.phase === 'idle') enter('inhale', now);
    else {
      S.phaseStart = now - S.phaseElapsed;
      showLabel(S.phase);
      schedulePad(S.phase, durationOf(S.phase) - S.phaseElapsed, S.fullness);
    }
    renderCounter();
    requestAnimationFrame(frame);
    scheduleHide();
  }
  function pause() {
    S.running = false;
    S.phaseElapsed = performance.now() - S.phaseStart;
    showLabel('paused');
    renderCounter();
    audioOff();
    showControls();
  }
  function finish() {
    S.running = false;
    S.phase = 'done';
    showLabel('done');
    renderCounter();
    audioOff();
    settle(0);
    showControls();
  }
  // Glide fullness toward a value when not running (used for finish and reset)
  function settle(to) {
    const from = S.fullness, t0 = performance.now(), d = 1800;
    const step = now => {
      if (S.running) return;
      const p = Math.min(1, (now - t0) / d);
      S.fullness = lerp(from, to, easeInOut(p));
      paint(S.fullness);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // Controls auto-hide while breathing
  let hideTimer = null;
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (S.running) { el.controls.classList.add('hidden'); el.top.classList.add('hidden'); }
    }, 3200);
  }
  function showControls() {
    el.controls.classList.remove('hidden'); el.top.classList.remove('hidden');
    if (S.running) scheduleHide();
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, showControls, { passive: true }));

  // iOS Safari ignores user-scalable=no. Block pinch and double-tap zoom directly,
  // since tapping the disc repeatedly must never change the page scale.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // Wire up
  el.disc.addEventListener('click', () => S.running ? pause() : start());
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); S.running ? pause() : start(); }
  });

  const fmt = v => `${parseFloat(v)} s`;
  function renderSummary() {
    const n = S.target ? `${S.target} breaths` : 'open count';
    el.summary.textContent = `${fmt(S.inhale)} breath, ${fmt(S.holdTop)} rest, ${n}`;
  }
  el.len.addEventListener('input', () => {
    S.inhale = S.exhale = parseFloat(el.len.value);
    el.outLen.textContent = fmt(el.len.value);
    renderSummary();
  });
  el.hold.addEventListener('input', () => {
    S.holdTop = parseFloat(el.hold.value);
    el.outHold.textContent = fmt(el.hold.value);
    renderSummary();
  });
  el.chips.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.chips.querySelectorAll('button').forEach(c => c.setAttribute('aria-pressed', c === b));
    S.target = parseInt(b.dataset.n, 10);
    if (!S.running) { S.count = 0; if (S.phase === 'done') { S.phase = 'idle'; showLabel('idle'); } }
    renderCounter();
    renderSummary();
  });

  const SOUND_ORDER = ['off', 'tone', 'guided'];
  function applySoundMode() {
    el.soundChips.style.setProperty('--i', SOUND_ORDER.indexOf(S.sound));
    el.soundChips.querySelectorAll('button').forEach(c => c.setAttribute('aria-pressed', c.dataset.sound === S.sound));
    if (S.sound !== 'off') {
      ensureAudio(); actx.resume();
      if (S.running) schedulePad(S.phase, durationOf(S.phase) - (performance.now() - S.phaseStart), S.fullness);
    } else audioOff();
  }
  el.soundChips.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.sound = b.dataset.sound;
    applySoundMode();
  });

  function openSheet(open) {
    body.classList.toggle('sheet-open', open);
    el.settings.setAttribute('aria-expanded', open);
    el.sheet.setAttribute('aria-hidden', !open);
  }
  el.settings.addEventListener('click', () => openSheet(true));
  el.done.addEventListener('click', () => openSheet(false));
  el.scrim.addEventListener('click', () => openSheet(false));
  el.theme.addEventListener('click', () => {
    S.theme = S.theme === 'dusk' ? 'dawn' : 'dusk';
    body.dataset.theme = S.theme;
    el.theme.setAttribute('aria-pressed', S.theme === 'dawn');
    paint(S.fullness);
  });

  // Initial (supports ?theme=dawn and ?auto=1 for linking straight into a breath)
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dawn') el.theme.click();
  paint(0);
  showLabel('idle');
  renderCounter();
  renderSummary();
  if (q.has('f')) {            // static preview of a given fullness, e.g. ?f=1 for the sun state
    S.fullness = Math.min(1, Math.max(0, parseFloat(q.get('f')) || 0));
    paint(S.fullness);
    showLabel(S.fullness > .5 ? 'inhale' : 'exhale');
  }
  if (q.get('auto') === '1') start();
})();
</script>
</body>
</html>
